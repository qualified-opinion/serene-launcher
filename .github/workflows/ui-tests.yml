name: UI tests

# Runs the on-device UI tests (app/src/androidTest) on an Android emulator. It is its own
# workflow so the main Build check stays fast; both run on every pull request.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and its UI tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - name: Run the UI tests on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew connectedDebugAndroidTest
      - name: Show failing UI tests in the log
        if: failure()
        run: |
          find app/build/outputs/androidTest-results -name '*.xml' -print0 2>/dev/null \
            | xargs -0 -r grep -l '<failure' \
            | while read -r file; do
                echo "::group::$file"
                sed -n '/<testcase/,/<\/testcase>/p' "$file" | grep -v '^\s*$' | head -n 400
                echo "::endgroup::"
              done
      - name: Upload the UI test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-test-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
