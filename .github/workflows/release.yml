name: Release

# Runs when the owner pushes a version tag such as v1.2.0 (or v1.2.0-beta1 for a pre-release).
# It builds the release APK, signs it with the key stored in the repository secrets and
# attaches the APK and its SHA-256 checksum to a GitHub Release for that tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Read the version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' must look like v1.2.3 or v1.2.3-beta1"
            exit 1
          fi
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SERENE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SERENE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SERENE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SERENE_KEY_PASSWORD }}
        run: |
          # Never publish an unsigned or debug-signed APK: stop if any secret is missing.
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret SERENE_$name is not set. See 'Publishing a release' in README.md."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/serene-release.jks"
          echo "SERENE_KEYSTORE_PATH=$RUNNER_TEMP/serene-release.jks" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        env:
          SERENE_KEYSTORE_PASSWORD: ${{ secrets.SERENE_KEYSTORE_PASSWORD }}
          SERENE_KEY_ALIAS: ${{ secrets.SERENE_KEY_ALIAS }}
          SERENE_KEY_PASSWORD: ${{ secrets.SERENE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PsereneVersion=${{ steps.version.outputs.version }}

      - name: Check the APK is signed and offline
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::Signed APK not found; is the signing key configured?"; exit 1; }
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk"
          manifest=$(find app/build/intermediates -path '*release*' -name AndroidManifest.xml | grep -i merged | head -n 1)
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "::error::The release build requests the INTERNET permission."
            exit 1
          fi

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/serene-release.jks"

      - name: Take the release notes from the changelog
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Use the CHANGELOG.md section headed "## [VERSION]" (or the version without its
          # pre-release suffix). Without one, GitHub generates notes from the merged PRs.
          notes="$RUNNER_TEMP/release-notes.md"
          for v in "$VERSION" "${VERSION%%-*}"; do
            awk -v head="## [$v]" '
              index($0, head) == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "$notes"
            if grep -q '[^[:space:]]' "$notes"; then
              echo "file=$notes" >> "$GITHUB_OUTPUT"
              echo "Using the CHANGELOG.md section for $v"
              exit 0
            fi
          done
          echo "No CHANGELOG.md section for $VERSION; GitHub will generate the notes."

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          name="serene-launcher-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          sha256sum "$name" > "$name.sha256"
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if [ -n "$NOTES_FILE" ]; then flags+=(--notes-file "$NOTES_FILE"); else flags+=(--generate-notes); fi
          # A release drafted on GitHub's website already exists for the tag; add the files to it.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$name" "$name.sha256" --clobber
            # Fill in the notes from the changelog only if the owner left them empty.
            if [ -n "$NOTES_FILE" ] && [ -z "$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$name" "$name.sha256" \
              --title "Serene Launcher $VERSION" --verify-tag "${flags[@]}"
          fi
