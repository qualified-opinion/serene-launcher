name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK, run unit tests and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug processReleaseManifest
      - name: Check the app stays offline
        run: |
          manifest=$(find app/build/intermediates -path '*release*' -name AndroidManifest.xml | grep -i merged | head -n 1)
          test -n "$manifest" || { echo "Merged release manifest not found"; exit 1; }
          echo "Checking $manifest"
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "::error::The release build requests the INTERNET permission. Serene Launcher must stay fully offline."
            exit 1
          fi
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: serene-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
